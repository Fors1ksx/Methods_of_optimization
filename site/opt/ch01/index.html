<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЛР1: постановка и точный ответ</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="stylesheet" href="../lib/katex/katex.min.css">
<link rel="stylesheet" href="../lib/opt.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/math.js"></script>
<script src="../lib/board.js"></script>
<script src="../lib/katex/katex.min.js"></script>
<script src="../lib/methods.js"></script>
<script src="../lib/opt.js"></script>
<script src="audio/ru/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 1, title: 'ЛР1: постановка и точный ответ', minutes: 10, language: 'ru', next: '../ch02/' };
const f = OPT.FN.f1.f;
// Стандартный график варианта 21 (ЛР1) слева — рисунок 1 отчёта.
const G1 = (p, o = {}) => graph(p, 'f1', { x0: 120, y0: 790, w: 800, h: 520, xs: [1, 4, .5], ys: [.5, 1.3, .1], name: 'f(x)=x-2\\ln x', ...o });
// Пунктирная хорда между точками графика (иллюстрация выпуклости).
function c1Chord(Gr, a, b, t0, color) {
  const l = path(Gr.layer, `M${Gr.PX(a)} ${Gr.PY(f(a))}L${Gr.PX(b)} ${Gr.PY(f(b))}`, { stroke: color, 'stroke-width': 3, 'stroke-dasharray': '10 8' }, { o: 0 });
  show(l, t0, .5);
  return l;
}

const BEATS = [
  ['intro', 'Глава 1', (m, D) => introCard(m, D, 'ЛР1 · Глава 1', 'Постановка задачи\nи точный ответ', 'цель · постановка · график · аналитическое решение')],

  ['task', 'Цель и постановка', (m) => {
    const p = panel(0);
    kick(p, '1.1 · Цель работы и постановка задачи');
    const g = G1(p);
    say(p, 'Цель работы', 1000, 180, m('goal'), { size: 24, fill: COL.dim, weight: 600 });
    para(p, 'Приобретение практических навыков решения задач одномерной минимизации численными методами.', 1000, 220, m('goal') + .2, { w: 540, size: 26 });
    say(p, 'Постановка (вариант 21)', 1000, 340, m('f'), { size: 24, fill: COL.dim, weight: 600 });
    tex(p, 'f(x)=x-2\\ln(x)\\ \\to\\ \\min', 1000, 360, m('f') + .2, { size: 40 });
    band(g, 1, 4, m('seg'));
    tex(p, 'x\\in[1;\\,4]', 1000, 440, m('seg') + .2, { size: 40 });
    tex(p, '\\varepsilon=0{,}0005', 1000, 515, m('eps'), { size: 40, color: COL.task });
    fdot(g, 2, m('x'), { label: 'x*', color: OC.best });
    tex(p, 'x^*=\\ ?\\qquad f(x^*)=\\ ?', 1000, 620, m('x') + .3, { size: 40, color: OC.best });
  }],

  ['methods', 'Три метода', (m) => {
    const p = panel(0);
    kick(p, '1.2 · Три метода, аналитика и сравнение');
    const L = [['1', 'Метод равномерного поиска', 'гл. 2', 'm1'], ['5', 'Метод золотого сечения', 'гл. 3', 'm5'], ['9', 'Метод Брента', 'гл. 4', 'm9']];
    L.forEach(([n, s, ch, k], i) => {
      item(p, n, s, 200 + i * 72, m(k), { color: COL.task, size: 32 });
      tag(p, ch, 720, 190 + i * 72, COL.dim, m(k) + .3, { size: 22 });
    });
    say(p, '№ — номера методов в задании', 96, 420, m('m9') + .8, { size: 22, fill: COL.dim });
    tag(p, 'аналитическое решение — в этой главе', 1180, 262, COL.good, m('an'), { size: 26, solid: true });
    say(p, 'Сравнить методы по числу…', 96, 520, m('cmp'), { size: 32, weight: 600 });
    const b1 = boxR(p, 96, 560, 660, 130, { stroke: COL.whole, sw: 3 }); show(b1, m('it'));
    say(p, 'итераций', 126, 610, m('it'), { size: 32, fill: COL.whole, weight: 700 });
    say(p, 'итерация — один шаг метода (проход цикла)', 126, 660, m('it') + .2, { size: 25 });
    const b2 = boxR(p, 820, 560, 680, 130, { stroke: COL.task, sw: 3 }); show(b2, m('ev'));
    say(p, 'вычислений функции', 850, 610, m('ev'), { size: 32, fill: COL.task, weight: 700 });
    say(p, 'вычисление — один вызов f(x)', 850, 660, m('ev') + .2, { size: 25 });
    para(p, 'Числа могут не совпадать. Поэтому каждый метод в программе сам считает вычисления f и возвращает их вместе с ответом и числом итераций.', 96, 760, m('diff'), { w: 1400, size: 27, fill: COL.dim });
  }],

  ['q1', 'Проверка: постановка', () => {
    const p = panel(0); kick(p, 'Проверка');
  }, { ask: done => quiz(WIDE, [{
    id: 'c-task', prompt: ['Верно или неверно по постановке ЛР1?'],
    build: TFQ([
      ['Минимум ищется на отрезке [1; 4]', true, 'Так в постановке: f(x) = x − 2ln(x) на [1; 4].'],
      ['Точность ε = 0,005', false, 'ε = 0,0005 — на порядок меньше.'],
      ['Точку минимума нужно найти ещё и аналитически', true, 'Это отдельное требование постановки.'],
      ['Число итераций всегда равно числу вычислений функции', false, 'Не обязательно — поэтому методы сравнивают по обоим числам.'],
    ]),
  }, {
    id: 'c-count', prompt: ['Зачем каждый метод в программе ЛР1 сам считает вычисления функции?'],
    build: choice(['Методы сравнивают и по числу вычислений, а оно может не совпадать с числом итераций', 'Чтобы найти точку минимума точнее', 'Без счётчика метод не остановится', 'Так требует аналитическое решение'], 0,
      'Сравнение по итерациям и по вычислениям — требование постановки, и эти числа бывают разными.',
      [null, 'Счётчик на ответ не влияет — он только считает вызовы f.', 'Остановка определяется условием метода, а не счётчиком.', 'Аналитическое решение счётчиков не использует.']),
  }], done) }],

  ['graph', 'График функции', (m) => {
    const p = panel(0);
    kick(p, '1.3 · График функции: один минимум');
    const g = G1(p, { t0: m('draw') });
    say(p, 'Рисунок 1 отчёта', 1000, 180, m('draw') + .5, { size: 24, fill: COL.dim, weight: 600 });
    curve(g, f, m('down'), { color: COL.whole, sw: 8, lo: 1, hi: 2 });
    say(p, 'убывает', 260, 420, m('down') + .3, { size: 28, fill: COL.whole, weight: 600 });
    fdot(g, 2, m('low'), { label: '≈ 2', color: OC.best });
    curve(g, f, m('up'), { color: OC.x2, sw: 8, lo: 2, hi: 4 });
    say(p, 'возрастает', 700, 660, m('up') + .3, { size: 28, fill: OC.x2, weight: 600 });
    para(p, 'По графику видно, что на отрезке функция имеет один минимум, то есть она унимодальна.', 1000, 240, m('one'), { w: 540, size: 30, weight: 600, fill: COL.good });
    say(p, 'Унимодальная на [a; b]:', 1000, 440, m('def'), { size: 26, fill: COL.dim, weight: 600 });
    para(p, 'единственная точка минимума x*; левее x* функция убывает, правее — возрастает.', 1000, 485, m('def') + .2, { w: 540, size: 27 });
  }],

  ['whyUni', 'Зачем унимодальность', (m) => {
    const p = panel(0);
    kick(p, '1.4 · Зачем методам унимодальность');
    const g = G1(p);
    const xa = 1.9, xb = 2.8, B = band(g, 1, 4, .5);
    fdot(g, xa, m('two'), { label: 'x₁', color: OC.x1 });
    fdot(g, xb, m('two') + .3, { label: 'x₂', color: OC.x2 });
    fval(g, xa, fm(f(xa), 3), m('cmp'), { color: OC.x1, dy: -26, dx: -70 });
    fval(g, xb, fm(f(xb), 3), m('cmp') + .3, { color: OC.x2, dy: -26 });
    tex(p, 'f(x_1)<f(x_2)', 1000, 160, m('cmp') + .4, { size: 42 });
    cut(g, xb, 4, m('cut'));
    moveBand(g, B, 1, xb, m('cut') + .3);
    tex(p, '\\Rightarrow\\ x^*\\le x_2:\\ \\ \\text{кусок }[x_2;\\,b]\\text{ выбросить}', 1000, 240, m('cut') + .6, { size: 32, color: COL.good });
    tagL(p, 'золотое сечение — гл. 3', 1000, 360, COL.task, m('gold'), { size: 24 });
    tagL(p, 'Брент: шаги золотого сечения — гл. 4', 1000, 420, COL.task, m('gold') + .5, { size: 24 });
    para(p, 'Если бы впадин было несколько, выброшенный кусок мог бы содержать самый глубокий минимум.', 1000, 500, m('risk'), { w: 540, size: 26, fill: COL.bad });
    para(p, 'Равномерный поиск ничего не выбрасывает — смотрит во все узлы сетки (гл. 2).', 1000, 640, m('uni'), { w: 540, size: 26, fill: COL.dim });
  }],

  ['nec', 'Необходимое условие', (m) => {
    const p = panel(0);
    kick(p, '1.5 · Аналитическое решение: необходимое условие');
    const g = G1(p);
    fdot(g, 2, m('need'), { label: 'x*', color: OC.best });
    tangent(g, 2, m('tan'), { color: OC.tan });
    texRows(p, [
      "f'(x)=0",
      "f'(x)=1-\\dfrac{2}{x}",
      "1-\\dfrac{2}{x}=0\\ \\Rightarrow\\ x=2",
      "2\\in[1;\\,4]",
    ], 1000, 160, [m('need'), m('d1'), m('zero'), m('in')], { size: 40, dy: 115, color: [COL.dim, COL.chalk, COL.task, COL.good] });
    say(p, '— касательная горизонтальна', 1190, 205, m('tan') + .2, { size: 24, fill: OC.tan });
    para(p, 'Условие только необходимое: f′ = 0 и в точке максимума. Нужна вторая производная.', 1000, 640, m('only'), { w: 540, size: 27, fill: COL.task, weight: 600 });
  }],

  ['suf', 'Достаточное условие', (m) => {
    const p = panel(0);
    kick(p, '1.5 · Достаточное условие и выпуклость');
    const g = G1(p);
    fdot(g, 2, m('min'), { label: 'min', color: OC.best });
    curve(g, f, m('conv'), { color: COL.good, sw: 7 });
    c1Chord(g, 1, 4, m('conv') + .6, COL.task);
    c1Chord(g, 1.3, 2.6, m('conv') + 1, COL.task);
    say(p, 'хорды выше графика', 560, 300, m('conv') + 1.2, { size: 24, fill: COL.task, anchor: 'middle' });
    texRows(p, [
      "f''(x)=\\dfrac{2}{x^2}",
      "f''(2)=\\dfrac{2}{4}=0{,}5>0",
      "\\Rightarrow\\ x=2\\ \\text{— минимум}",
      "f''(x)>0\\ \\ \\text{при всех } x>0",
      "\\Rightarrow\\ \\text{выпукла}",
      "\\Rightarrow\\ \\text{минимум единственный}",
    ], 1000, 150, [m('d2'), m('at2'), m('min'), m('all'), m('conv'), m('uniq')], { size: 36, dy: 100, color: [COL.chalk, COL.chalk, COL.good, COL.chalk, COL.task, COL.good] });
  }],

  ['q2', 'Проверка: производные', () => {
    const p = panel(0); kick(p, 'Проверка');
    texRows(p, ['f(x)=x-2\\ln(x)', "f'(x)=1-\\dfrac{2}{x}", "f''(x)=\\dfrac{2}{x^2}"], 120, 200, [.3, .5, .7], { size: 46, dy: 140 });
  }, { ask: done => quiz(QR, [{
    id: 'c-der', prompt: ['Посчитайте для f(x) = x − 2ln(x):'],
    build: numIn([{ parts: ["f′(1) = ", { num: -1, tol: 1e-6, d: 2, w: 7 }], why: 'f′(1) = 1 − 2/1 = −1 < 0: слева от 2 функция убывает.' },
      { parts: ["f′(4) = ", { num: 0.5, tol: 1e-6, d: 2, w: 7 }], why: 'f′(4) = 1 − 2/4 = 0,5 > 0: справа от 2 функция растёт.' },
      { parts: ["f″(4) = ", { num: 0.125, tol: 1e-6, d: 3, w: 7 }], why: 'f″(4) = 2/16 = 0,125 > 0.' }]),
  }, {
    id: 'c-conv', prompt: ['Что в отчёте следует из того, что f″(x) = 2/x² > 0 при всех x > 0?'],
    build: choice(['Функция выпукла, поэтому минимум на отрезке единственный', 'x = 2 — точка максимума', 'Производная нигде не равна нулю', 'На концах отрезка значения меньше, чем в x = 2'], 0,
      'Положительная вторая производная всюду ⇒ выпуклость ⇒ одна впадина.',
      [null, 'f″(2) = 0,5 > 0 — это минимум.', 'f′(2) = 0 — от знака f″ это не зависит.', 'Концы проверяют отдельно: f(1) = 1 и f(4) ≈ 1,2274 больше.']),
  }], done) }],

  ['ends', 'Концы и ответ', (m) => {
    const p = panel(0);
    kick(p, '1.5 · Концы отрезка: минимум глобальный');
    const g = G1(p);
    fdot(g, 1, m('f1'), { label: 'a = 1', color: OC.x1 });
    fval(g, 1, '1', m('f1') + .3, { color: OC.x1, dy: -22 });
    fdot(g, 4, m('f4'), { label: 'b = 4', color: OC.x2 });
    fval(g, 4, '1,2274', m('f4') + .3, { color: OC.x2, anchor: 'end', dx: -22, dy: 6 });
    fdot(g, 2, m('f2'), { label: 'x* = 2', color: OC.best });
    fval(g, 2, '0,613706', m('f2') + .3, { color: OC.best, dy: 44, dx: 16 });
    texRows(p, [
      'f(1)=1-2\\ln 1=1',
      'f(4)=4-2\\ln 4\\approx 1{,}2274',
      'f(2)=2-2\\ln 2\\approx 0{,}613706',
    ], 1000, 160, [m('f1'), m('f4'), m('f2')], { size: 34, dy: 85, color: [OC.x1, OC.x2, OC.best] });
    para(p, 'f(1) и f(4) больше, чем f(2) ⇒ минимум глобальный', 1000, 470, m('cmp'), { w: 540, size: 28, fill: COL.task, weight: 600 });
    const bx = boxR(p, 990, 580, 560, 170, { stroke: COL.good, sw: 3 }); show(bx, m('ans'));
    tex(p, 'x^*=2', 1020, 590, m('ans') + .2, { size: 44, color: COL.good });
    tex(p, 'f(x^*)=2-2\\ln 2\\approx 0{,}613706', 1020, 665, m('ans') + .4, { size: 34, color: COL.good });
  }],

  ['etalon', 'Эталон', (m) => {
    const p = panel(0);
    kick(p, '1.6 · Эталон для численных методов');
    tag(p, 'эталон: x* = 2,  f* ≈ 0,613706', 1230, 92, COL.good, m('ref'), { size: 26, solid: true });
    const cb = codeBlock(p, ['print("точное решение: x = 2, f =", 2 - 2 * math.log(2))'], 110, 170, m('code'), { first: 150, w: 840, size: 22, title: 'lab1_var21.py, запуск' });
    codeHl(cb, 150, 150, m('code') + .5);
    say(p, 'вывод:  точное решение: x = 2, f = 0.6137056388801094', 130, 262, m('code') + 1, { size: 20, fill: COL.dim, font: MONO });
    const tb = table(p, { x: 120, y: 320, cols: [['метод', 470], ['найденный x', 260], ['|x − x*|', 260]], rh: 62, size: 30, t0: m('res'), mono: [1, 2] });
    const R = [['равномерный поиск', '2,000000', '0'], ['золотое сечение', '2,000028', '0,000028'], ['метод Брента', '1,999967', '0,000033']];
    R.forEach(([n, x], i) => tb.row([n, x, ''], m('res') + .3 + i * 1.3));
    R.forEach(([, , d], i) => say(p, d, tb.xs[2] + 14, tb.rowY(i) + 62 * .66, m('dev') + i * .4, { size: 30, fill: COL.task, font: MONO }));
    tag(p, 'все < ε = 0,0005', 1340, 460, COL.good, m('dev') + 1.5, { size: 28 });
    para(p, 'Вывод отчёта: все три метода получили точку минимума с точностью не хуже ε = 0,0005.', 120, 650, m('concl'), { w: 1360, size: 30, fill: COL.good, weight: 600 });
    tagRow(p, ['гл. 2 · равномерный поиск', 'гл. 3 · золотое сечение', 'гл. 4 · метод Брента'], 120, 760, COL.whole, m('next'), { size: 26, dt: .4 });
  }],

  ['sum', 'Главное', (m) => {
    const p = panel(0);
    wrapList(p, [['Цель — навыки одномерной минимизации. f(x) = x − 2ln(x) на [1; 4], ε = 0,0005, методы №1, №5, №9, сравнение по итерациям и вычислениям f.', 'w1'],
      ['По графику минимум один — функция унимодальна. Это нужно методам, которые выбрасывают части отрезка.', 'w2'],
      ['f′ = 1 − 2/x = 0 ⇒ x = 2; f″(2) = 0,5 > 0; f″ > 0 при x > 0 ⇒ выпукла; f(1) = 1, f(4) ≈ 1,2274 больше.', 'w3'],
      ['x* = 2, f(x*) = 2 − 2ln2 ≈ 0,613706 — эталон для трёх программ.', 'w4']], m, { size: 30, dy: 150 });
  }],

  ['final1', 'Практика 1', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-an', prompt: ['Решите аналитически так же, как в разделе 5 отчёта: f(x) = x − 3ln(x) на [1; 5]. Найдите точку минимума, вторую производную в ней и значение функции (6 знаков).'],
    build: numIn([{ parts: ['x* = ', { num: 3, tol: 1e-6, d: 2, w: 7 }], why: 'f′ = 1 − 3/x = 0 ⇒ x = 3, и 3 ∈ [1; 5].' },
      { parts: ['f″(x*) = ', { num: 1 / 3, tol: 2e-5 }], why: 'f″ = 3/x², f″(3) = 3/9 ≈ 0,333333 > 0 — минимум.' },
      { parts: ['f(x*) = ', { num: 3 - 3 * Math.log(3), tol: 2e-5 }], why: 'f(3) = 3 − 3ln3 ≈ −0,295837; концы f(1) = 1 и f(5) ≈ 0,171686 больше.' }]),
  }], done, 'Практика главы   1 из 3') }],

  ['final2', 'Практика 2', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-seg', prompt: ['Та же функция f(x) = x − 2ln(x), но отрезок [3; 4]. Найдите f′(3), точку минимума на отрезке и значение в ней (6 знаков).'],
    build: numIn([{ parts: ['f′(3) = ', { num: 1 / 3, tol: 2e-5 }], why: 'f′(3) = 1 − 2/3 ≈ 0,333333 > 0: на [3; 4] функция растёт.' },
      { parts: ['x* = ', { num: 3, tol: 1e-6, d: 2, w: 7 }], why: 'Стационарная точка 2 не лежит на [3; 4] — минимум на левом конце.' },
      { parts: ['f(x*) = ', { num: 3 - 2 * Math.log(3), tol: 2e-5 }], why: 'f(3) = 3 − 2ln3 ≈ 0,802775.' }]),
  }], done, 'Практика главы   2 из 3') }],

  ['final3', 'Практика 3', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-dev', prompt: ['Эталон x* = 2. Ответы программ из раздела 8 отчёта: золотое сечение 2,000028, Брент 1,999967. Найдите отклонения |x − x*| и запас до точности ε у метода Брента.'],
    build: numIn([{ parts: ['золотое: |x − x*| = ', { num: 0.000028, tol: 1.5e-6 }], why: '|2,000028 − 2| = 0,000028.' },
      { parts: ['Брент: |x − x*| = ', { num: 0.000033, tol: 1.5e-6 }], why: '|1,999967 − 2| = 0,000033.' },
      { parts: ['Брент: ε − |x − x*| = ', { num: 0.000467, tol: 1.5e-6 }], why: '0,0005 − 0,000033 = 0,000467 > 0 — точность не хуже ε.' }]),
  }, {
    id: 'p-role', prompt: ['Что даёт каждый шаг аналитического решения в отчёте?'],
    build: grid([
      { parts: ['f′(x) = 1 − 2/x = 0 ⇒ x = 2'], ans: ['n'], why: 'Необходимое условие: кандидат в экстремум.' },
      { parts: ['f″(2) = 0,5 > 0'], ans: ['s'], why: 'Достаточное условие: в x = 2 минимум.' },
      { parts: ['f″(x) > 0 при всех x > 0'], ans: ['u'], why: 'Выпуклость ⇒ минимум единственный.' },
      { parts: ['f(1) = 1 и f(4) ≈ 1,2274 больше f(2)'], ans: ['g'], why: 'Сравнение с концами ⇒ минимум глобальный.' },
    ], [['n', 'кандидат', COL.whole, '1'], ['s', 'минимум', COL.task, '2'], ['u', 'единственный', COL.real, '3'], ['g', 'глобальный', COL.good, '4']], { multi: false, text: true }),
  }], done, 'Практика главы   3 из 3') }],

  ['finish', 'Финиш', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
