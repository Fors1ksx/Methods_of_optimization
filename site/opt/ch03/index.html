<script>
'use strict';
const CHAPTER = { number: 3, title: 'Метод золотого сечения', minutes: 12, language: 'ru', next: '../ch04/' };
// Глава строго по отчёту ЛР1 (§2, §6, §7 — функция golden, §8, §9 — таблицы 2 и 3, §10).
const f = OPT.FN.f1.f, K = OPT.K, FS = 2 - 2 * Math.log(2);
const R3 = runM('golden', 'f1');            // 19 итераций, 21 вычисление — как в отчёте
// Стандартный график варианта 21 слева.
const G3 = (p, o = {}) => graph(p, 'f1', { x0: 120, y0: 790, w: 800, h: 520, xs: [1, 4, .5], ys: [.5, 1.3, .1], name: 'f(x)=x-2\\ln x', ...o });
// «Лупа»: по вертикали (f − f*)·S.
const G3z = (p, xs, ys, S, o = {}) => graph(p, x => (f(x) - FS) * S, { x0: 120, y0: 790, w: 760, h: 500, xs, ys, yl: `(f − f*)·${S === 1000 ? '10³' : '10⁸'}`, ...o });
// Листинг функции golden из отчёта (строки 34–65 файла lab1_var21.py).
const GOLD = `def golden(a, b, eps):
    x1 = b - k * (b - a)          # левая точка (38.2% от a)
    x2 = a + k * (b - a)          # правая точка (61.8% от a)
    f1 = f(x1)
    f2 = f(x2)
    cnt = 2
    it = 0
    while True:
        it += 1
        if f1 <= f2:
            # справа от x2 минимума нет -> выкидываем [x2, b]
            b = x2
            # старая x1 как раз оказывается на месте новой x2, f не пересчитываем
            x2 = x1
            f2 = f1
            if b - a <= eps:
                break
            x1 = b - k * (b - a)
            f1 = f(x1)
        else:
            # слева от x1 минимума нет -> выкидываем [a, x1]
            a = x1
            x1 = x2
            f1 = f2
            if b - a <= eps:
                break
            x2 = a + k * (b - a)
            f2 = f(x2)
        cnt += 1
    x = (a + b) / 2               # ответ - середина того, что осталось
    cnt += 1
    return x, f(x), it, cnt`.split('\n');
const note3 = (p, str, x, y, t0, o = {}) => para(p, str, x, y, t0, { w: 520, size: 26, fill: COL.chalk, ...o });

const BEATS = [
  ['intro', 'Глава 3', (m, D) => introCard(m, D, 'ЛР1 · Глава 3', 'Метод золотого сечения', 'метод № 5 вашей первой лабораторной')],

  ['task', 'Задача и идея', (m) => {
    const p = panel(0);
    kick(p, '3.1 · Задача из отчёта и идея метода');
    const g = G3(p, { w: 760 });
    tex(p, 'f(x)=x-2\\ln x,\\quad [1;\\,4],\\quad \\varepsilon=0{,}0005', 960, 190, m('f'), { size: 34 });
    note3(p, 'Унимодальна: один минимум, слева f убывает, справа растёт.', 960, 330, m('uni'), { fill: COL.dim });
    const B = band(g, 1, 4, m('two') - .3);
    fdot(g, 2.2, m('two'), { label: 'x₁', color: OC.x1 });
    fdot(g, 3.0, m('two') + .3, { label: 'x₂', color: OC.x2 });
    cut(g, 3.0, 4, m('idea') + .4); moveBand(g, B, 1, 3.0, m('idea') + .6);
    tag(p, 'два значения → кусок отрезка выбрасываем', 1225, 520, COL.task, m('idea'), { size: 26, solid: true });
    tag(p, 'повторяем, пока b − a > ε', 1225, 600, COL.good, m('idea') + 2, { size: 26 });
  }],

  ['cmp', 'Правило сравнения', (m) => {
    const p = panel(0);
    kick(p, '3.2 · Правило из отчёта: какой кусок выбросить');
    const gL = graph(p, 'f1', { x0: 110, y0: 780, w: 640, h: 380, xs: [1, 4, .5], ys: [.5, 1.3, .1], t0: .2 });
    const gR = graph(p, 'f1', { x0: 880, y0: 780, w: 640, h: 380, xs: [1, 4, .5], ys: [.5, 1.3, .1], t0: .3 });
    tex(p, 'f(x_1)\\le f(x_2)\\ \\Rightarrow\\ b:=x_2', 430, 170, m('left'), { size: 34, anchor: 'middle', w: 700 });
    fdot(gL, 2.146, m('left') + .3, { label: 'x₁', color: OC.x1 }); fdot(gL, 2.854, m('left') + .5, { label: 'x₂', color: OC.x2 });
    cut(gL, 2.854, 4, m('left') + 1.5);
    para(p, 'Если бы минимум был правее x₂, обе точки лежали бы на убывающей части и было бы f(x₁) > f(x₂).', 130, 268, m('why'), { w: 620, size: 22, fill: COL.dim });
    tex(p, 'f(x_1)>f(x_2)\\ \\Rightarrow\\ a:=x_1', 1200, 170, m('right'), { size: 34, anchor: 'middle', w: 700 });
    fdot(gR, 1.3, m('right') + .3, { label: 'x₁', color: OC.x1 }); fdot(gR, 1.7, m('right') + .5, { label: 'x₂', color: OC.x2 });
    cut(gR, 1, 1.3, m('right') + 1.5);
    tag(p, 'выброшенный кусок не содержит минимума', 1200, 300, COL.good, m('keep'), { size: 24, solid: true });
  }],

  ['q1', 'Проверка: что выбросить', () => {
    const p = panel(0); kick(p, 'Проверка');
    const g = G3(p, { w: 760 });
    fdot(g, 2.146, .3, { label: 'x₁', color: OC.x1 }); fdot(g, 2.854, .5, { label: 'x₂', color: OC.x2 });
    fval(g, 2.146, '0,619', .7, { color: OC.x1, dy: -26 }); fval(g, 2.854, '0,757', .8, { color: OC.x2, dy: -26 });
  }, { ask: done => quiz(QR, [{
    id: 'c-cut', prompt: ['Ваш старт: f(x₁) = 0,619, f(x₂) = 0,757, x₁ < x₂. Что делает программа?'],
    build: choice(['b := x₂ — выбрасывает [x₂; b]', 'a := x₁ — выбрасывает [a; x₁]', 'выбрасывает [x₁; x₂]', 'считает третью точку'], 0,
      'f(x₁) ≤ f(x₂), значит минимум не правее x₂.',
      [null, 'Так делают, когда f(x₁) > f(x₂).', 'Минимум как раз может лежать между точками.', 'Двух значений достаточно — f унимодальна.']),
  }, {
    id: 'c-cut2', prompt: ['На отрезке [1,708204; 2,854102]: f(x₁ = 2,145898) = 0,618782, f(x₂ = 2,416408) = 0,651844. Каким станет отрезок?'],
    build: choice(['[1,708204; 2,416408]', '[2,145898; 2,854102]', '[1,708204; 2,145898]', '[2,145898; 2,416408]'], 0,
      'f(x₁) ≤ f(x₂) ⇒ b := x₂ = 2,416408 (итерация 3 вашей программы).',
      [null, 'Так было бы при f(x₁) > f(x₂).', 'Новым концом становится x₂, а не x₁.', 'Выбрасывается только один кусок.']),
  }], done) }],

  ['points', 'Где ставить точки', (m) => {
    const p = panel(0);
    kick(p, '3.3 · Точки делят отрезок в золотой пропорции');
    const g = G3(p, { w: 760 });
    band(g, 1, 4, .4);
    texRows(p, ['x_1=a+0{,}382\\,(b-a)', 'x_2=a+0{,}618\\,(b-a)'], 960, 160, [m('f1'), m('f2')], { size: 38, dy: 70, color: [OC.x1, OC.x2] });
    tex(p, 'x_1=1+0{,}381966\\cdot 3\\approx 2{,}145898', 960, 330, m('calc'), { size: 32 });
    fdot(g, 4 - K * 3, m('calc') + .4, { label: 'x₁', color: OC.x1 });
    tex(p, 'x_2=1+0{,}618034\\cdot 3\\approx 2{,}854102', 960, 400, m('calc2'), { size: 32 });
    fdot(g, 1 + K * 3, m('calc2') + .4, { label: 'x₂', color: OC.x2 });
    codeBlock(p, ['k = (math.sqrt(5) - 1) / 2   # ~0.618', 'x1 = b - k * (b - a)', 'x2 = a + k * (b - a)'], 970, 540, m('code'), { size: 21, w: 560, numbers: false, title: 'в программе (lab1_var21.py)' });
  }],

  ['reuse', 'Главное свойство', (m) => {
    const p = panel(0);
    kick(p, '3.3 · Главное свойство: одна точка переходит в следующий шаг');
    const g = G3(p);
    const x1 = 4 - K * 3, x2 = 1 + K * 3, B = band(g, 1, 4, .4);
    const d1 = fdot(g, x1, .5, { label: 'x₁', color: OC.x1 }), d2 = fdot(g, x2, .7, { label: 'x₂', color: OC.x2 });
    const L = 1010, Rr = 1530, Y = 250;
    const seg3 = (y, a, b, t, c = COL.chalk) => { const l = path(p, `M${a} ${y}H${b}`, { stroke: c, 'stroke-width': 5 }, { d: 0 }); draw(l, t, .6); return l; };
    const tick3 = (x, y, lab, c, t) => { const gg = G(p, { o: 0 }); mk('path', { d: `M${x} ${y - 16}V${y + 16}`, stroke: c, 'stroke-width': 4 }, gg); T(gg, lab, { x, y: y + 46, size: 24, fill: c, anchor: 'middle', font: MATH }); show(gg, t); };
    seg3(Y, L, Rr, .6); tick3(L, Y, 'a', COL.dim, .6); tick3(Rr, Y, 'b', COL.dim, .6);
    tick3(L + .382 * (Rr - L), Y, '0,382', OC.x1, .9); tick3(L + .618 * (Rr - L), Y, '0,618', OC.x2, 1.1);
    cut(g, x2, 4, m('cut')); moveBand(g, B, 1, x2, m('cut') + .2); hide(d2, m('cut') + .2);
    const R2 = L + .618 * (Rr - L), Y2 = 400;
    seg3(Y2, L, R2, m('cut') + .3, COL.whole); tick3(L, Y2, 'a', COL.dim, m('cut') + .3); tick3(R2, Y2, 'x₂ → b', COL.dim, m('cut') + .3);
    pulse(d1, m('stay'));
    tick3(L + .618 * (R2 - L), Y2, '0,618 нового', OC.x1, m('prop'));
    say(p, 'старая x₁ стала новой x₂', 1010, 520, m('prop') + .5, { size: 28, fill: OC.x1, weight: 600 });
    say(p, 'f в ней уже посчитана', 1010, 570, m('free'), { size: 26, fill: COL.dim });
    fdot(g, x2 - K * (x2 - 1), m('one'), { label: 'новая x₁', color: OC.u, ly: 64 });
    tag(p, '1 новое вычисление f за итерацию', 1270, 670, COL.good, m('one') + .4, { size: 28, solid: true });
  }],

  ['ratio', 'Откуда 0,618', (m) => {
    const p = panel(0);
    kick(p, '3.4 · Откуда число 0,618');
    texRows(p, [
      '[0;\\,1]:\\quad x_1=1-k,\\quad x_2=k',
      '\\text{после шага: }[0;\\,k],\\ \\ x_1 \\text{ должна стоять в } k\\cdot k',
      'k^2=1-k',
      'k=\\dfrac{\\sqrt5-1}{2}\\approx 0{,}618034',
      'L_{n+1}=0{,}618\\,L_n,\\qquad 1/0{,}618\\approx 1{,}618',
    ], 120, 160, [m('unit'), m('after'), m('eq'), m('root'), m('shrink')], { size: 44, dy: 128, color: [COL.chalk, COL.chalk, COL.task, COL.good, COL.whole] });
    tag(p, 'в отчёте: «длина уменьшается в 1/0,618 ≈ 1,618 раза»', 1060, 820, COL.dim, m('shrink') + 1, { size: 22 });
  }],

  ['q2', 'Проверка: точки', () => {
    const p = panel(0); kick(p, 'Проверка');
    texRows(p, ['x_1=a+0{,}382\\,(b-a)', 'x_2=a+0{,}618\\,(b-a)'], 120, 200, [.3, .5], { size: 44, dy: 100 });
    tex(p, '0{,}382 = 1-0{,}618034 = 0{,}381966', 120, 420, .7, { size: 34, color: COL.dim });
  }, { ask: done => quiz(QR, [{
    id: 'c-pts', prompt: ['Отрезок [0; 2]. Найдите стартовые точки (6 знаков, k = 0,618034).'],
    build: numIn([{ parts: ['x₁ = ', { num: 2 - 2 * K, tol: 2e-6 }], why: 'x₁ = 2 − 0,618034·2 = 0,763932.' }, { parts: ['x₂ = ', { num: 2 * K, tol: 2e-6 }], why: 'x₂ = 0 + 0,618034·2 = 1,236068.' }]),
  }, {
    id: 'c-next', prompt: ['Ваша программа после первой итерации: отрезок [1; 2,854102], x₂ = 2,145898 (старая x₁). Где новая x₁ = b − k(b − a)?'],
    build: numIn([{ parts: ['x₁ = ', { num: 2.854102 - K * 1.854102, tol: 2e-5 }], why: 'x₁ = 2,854102 − 0,618034·1,854102 = 1,708204.' }]),
  }], done) }],

  ['run1', 'Первые итерации', (m) => {
    const p = panel(0);
    kick(p, '3.5 · Ваша программа: итерации 0–4');
    const g = G3(p, { w: 760 });
    const ts = [m('s0'), m('s1'), m('s2'), m('s3'), m('s4')];
    animate(g, R3, { from: 0, to: 4, ts });
    iterTable(p, ['k', 'a', 'b', 'x₁', 'x₂'], R3.steps.slice(0, 5).map(s => [String(s.k), s.a, s.b, s.pts[0].x, s.pts[1].x]), ts, { x: 960, y: 230, widths: [50, 130, 130, 130, 130], size: 21 });
    tag(p, 'строка = одно новое вычисление f', 1225, 600, COL.task, m('tbl'), { size: 24, solid: true });
  }],

  ['run2', 'Лупа: итерации 5–19', (m) => {
    const p = panel(0);
    kick(p, '3.5 · Лупа: дальше отрезок сжимается в 0,618 раза за шаг');
    const g = G3z(p, [1.86, 2.16, .05], [0, 6, 1], 1000, { t0: m('zoom') });
    const B = band(g, R3.steps[5].a, R3.steps[5].b, m('s5'));
    let prev = [];
    [[5, 's5'], [7, 's7'], [9, 's9'], [11, 's11']].forEach(([k, mk3]) => {
      const s = R3.steps[k], t = m(mk3);
      moveBand(g, B, s.a, s.b, t);
      prev.forEach(e => hide(e, t, .3)); prev = [];
      s.pts.forEach(q => prev.push(fdot(g, q.x, t + .25, { color: q.c === 'q' ? OC.x2 : OC.x1, label: q.l, y: (q.y - FS) * 1000 })));
    });
    vline(g, 2, m('zoom') + .5, { label: 'x* = 2', color: COL.good });
    const rows = R3.steps.slice(5).map(s => [String(s.k), s.a, s.b, s.b - s.a]);
    const ts = rows.map((r, i) => { const k = +r[0]; return k <= 6 ? m('s5') : k <= 8 ? m('s7') : k <= 10 ? m('s9') : k <= 12 ? m('s11') : m('len') + (k - 13) * .15; });
    const tb = iterTable(p, ['k', 'a', 'b', 'b − a'], rows, ts, { x: 960, y: 150, widths: [50, 160, 160, 150], size: 18, rh: 40 });
    tag(p, 'b − a умножается на 0,618', 1250, 790, COL.task, m('len') + 2.5, { size: 24, solid: true });
  }],

  ['final', 'Итоговый отрезок', (m) => {
    const p = panel(0);
    kick(p, '3.6 · Результат из отчёта: отрезок, середина, ответ');
    const a = 1.999868, b = 2.000189, xm = (a + b) / 2;
    const g = G3z(p, [1.9997, 2.0004, .0001], [0, 1.4, .2], 1e8, { t0: .2 });
    band(g, a, b, m('n19'));
    tex(p, '[1{,}999868;\\ 2{,}000189]', 960, 200, m('n19') + .3, { size: 38 });
    tex(p, 'b-a=0{,}000321<\\varepsilon=0{,}0005', 960, 290, m('len'), { size: 34 });
    fdot(g, xm, m('mid'), { label: 'x', color: OC.best, ly: 64 });
    tex(p, 'x=\\dfrac{a+b}{2}=2{,}000028', 960, 380, m('mid') + .3, { size: 38, color: COL.good });
    tex(p, 'f(x)=0{,}6137056391', 960, 480, m('mid') + 1, { size: 34 });
    note3(p, 'Минимум внутри отрезка, середина отстоит от любой его точки не дальше (b − a)/2.', 960, 600, m('why'), { size: 24, fill: COL.dim });
    vline(g, 2, m('err'), { label: 'x* = 2', color: COL.task });
    tag(p, '|x − x*| = 0,000028', 1240, 760, COL.task, m('err') + .4, { size: 26, solid: true });
  }],

  ['count', 'Итерации и вычисления', (m) => {
    const p = panel(0);
    kick(p, '3.6 · Сколько итераций и вычислений — заранее');
    texRows(p, ['3\\cdot 0{,}618^{\\,n}\\le 0{,}0005', 'n\\ge \\dfrac{\\ln(0{,}0005/3)}{\\ln 0{,}618}\\approx 18{,}1\\ \\Rightarrow\\ n=19'], 120, 170, [m('ineq'), m('n')], { size: 44, dy: 150 });
    const parts = [['2', 'f в начальных точках x₁, x₂', COL.whole, m('e2')], ['18', 'по одной новой точке на итерациях 1–18 (на 19-й не нужна)', COL.task, m('e18')], ['1', 'f в середине итогового отрезка', COL.good, m('e1')]];
    parts.forEach(([n, s, c, t], i) => { tag(p, n, 180, 520 + i * 84, c, t, { size: 34, solid: true }); say(p, s, 240, 532 + i * 84, t + .2, { size: 30 }); });
    say(p, '2 + 18 + 1 = 21 вычисление', 1520, 820, m('sum'), { size: 42, fill: COL.chalk, weight: 600, anchor: 'end' });
  }],

  ['code1', 'Код: первая ветка', (m) => {
    const p = panel(0);
    kick(p, '3.7 · Функция golden из листинга: начало и первая ветка');
    const cb = codeBlock(p, GOLD.slice(0, 19), 100, 140, .2, { size: 19, first: 34, w: 1010 });
    let prev = null;
    const step = (from, to, t, txt, col = COL.task) => {
      if (prev) { hide(prev[0], t, .3); hide(prev[1], t, .3); }
      const r = codeHl(cb, from, to, t, { color: col });
      const tx = para(p, txt, 1140, 220, t + .2, { w: 410, size: 26 });
      prev = [r, tx];
    };
    step(35, 40, m('init'), 'Две точки, два вычисления: cnt = 2, it = 0.', OC.x1);
    step(41, 42, m('loop'), 'Бесконечный цикл; в начале итерации it += 1.');
    step(43, 45, m('if1'), 'f1 ≤ f2 ⇒ b = x2: выбрасываем [x2; b].');
    step(46, 48, m('reuse'), 'x2 = x1, f2 = f1 — старая точка переходит в новую x2, f не пересчитываем.', COL.good);
    step(49, 50, m('stop'), 'Проверка b − a ≤ eps до новой точки: лишнего вычисления нет.', COL.bad);
    step(51, 52, m('new'), 'Новая x1 = b − k(b − a) и её f — единственное новое вычисление.', OC.u);
  }],

  ['code2', 'Код: вторая ветка и ответ', (m) => {
    const p = panel(0);
    kick(p, '3.7 · Функция golden: вторая ветка, счётчик, ответ');
    const cb = codeBlock(p, GOLD.slice(19), 100, 160, .2, { size: 21, first: 53, w: 1010 });
    let prev = null;
    const step = (from, to, t, txt, col = COL.task) => {
      if (prev) { hide(prev[0], t, .3); hide(prev[1], t, .3); }
      const r = codeHl(cb, from, to, t, { color: col });
      const tx = para(p, txt, 1140, 220, t + .2, { w: 410, size: 26 });
      prev = [r, tx];
    };
    step(53, 57, m('else'), 'f1 > f2 ⇒ a = x1; старая x2 со своим f переходит в x1.');
    step(58, 61, m('new2'), 'Не остановились — новая x2 = a + k(b − a) и её f.', OC.u);
    step(62, 62, m('cnt'), 'cnt += 1 — только когда новая точка посчитана.', COL.good);
    step(63, 64, m('end'), 'Ответ — середина; ещё одно вычисление f(x).');
    step(65, 65, m('ret'), 'return x, f(x), it, cnt → 2,000028; 0,6137056391; 19; 21', COL.good);
    tag(p, 'таблица 2 отчёта: 19 итераций · 21 вычисление', 1325, 640, COL.good, m('ret') + 1, { size: 24, solid: true });
  }],

  ['q3', 'Проверка: по коду', () => {
    const p = panel(0); kick(p, 'Проверка');
    codeBlock(p, GOLD.slice(9, 19), 110, 170, .3, { size: 20, first: 43, w: 820 });
  }, { ask: done => quiz(QR, [{
    id: 'c-reuse', prompt: ['Зачем в первой ветке строки x2 = x1 и f2 = f1?'],
    build: choice(['Старая x1 стоит на месте новой x2 — её f уже известна, пересчитывать не нужно', 'Чтобы точки не совпали', 'Так быстрее выполняется проверка b − a ≤ eps', 'Это ошибка: x2 надо считать заново'], 0,
      'В этом и экономия: одно новое вычисление за итерацию.',
      [null, 'Точки как раз остаются разными: новая x1 считается ниже.', 'Проверка от этих строк не зависит.', 'Не ошибка — это главное свойство метода.']),
  }, {
    id: 'c-eps1', prompt: ['Что вернёт golden(1, 4, 1) — сколько итераций и вычислений? (3·0,618ⁿ ≤ 1)'],
    build: numIn([{ parts: ['it = ', { num: 3, tol: 0, d: 0, w: 6 }], why: '3·0,618ⁿ ≤ 1 ⇒ n ≥ 2,28 ⇒ 3 итерации.' }, { parts: ['cnt = ', { num: 5, tol: 0, d: 0, w: 6 }], why: '2 + 2 + 1 = 5.' }]),
  }], done) }],

  ['eps', 'Таблица 3', (m) => {
    const p = panel(0);
    kick(p, '3.8 · Таблица 3 отчёта: число вычислений при разных ε');
    const rows = [['0,1', '31', '10', '7'], ['0,01', '301', '14', '10'], ['0,001', '3001', '19', '10'], ['0,0005', '6001', '21', '9'], ['0,0001', '30001', '24', '13'], ['0,00001', '300001', '29', '16']];
    const tb = table(p, { x: 120, y: 190, cols: [['ε', 200], ['Равномерный', 250], ['Золотое', 220], ['Брент', 200]], rh: 64, size: 30, t0: m('tbl'), mono: [0, 1, 2, 3] });
    rows.forEach((r, i) => tb.row(r, m('tbl') + .3 + i * .25));
    tb.hl(3, COL.task, m('tbl') + 2);
    tag(p, '≈ +5 вычислений на каждое ε : 10', 1270, 260, COL.good, m('log'), { size: 26, solid: true });
    tex(p, '0{,}618^{5}\\approx 0{,}09\\approx\\tfrac{1}{10}', 1270, 330, m('why'), { size: 40, anchor: 'middle', w: 560 });
    note3(p, 'Равномерный поиск: ε : 10 ⇒ работы × 10.', 1040, 500, m('cmp'), { w: 500, fill: COL.dim });
    note3(p, 'Брент — в 1,4–2,3 раза меньше, чем золотое сечение (глава 4).', 1040, 620, m('brent'), { w: 500, fill: COL.dim });
  }],

  ['concl', 'Вывод из отчёта', (m) => {
    const p = panel(0);
    kick(p, '3.9 · Вывод из отчёта (§10)');
    item(p, 1, 'Повторное использование точки → 21 вычисление функции', 260, m('c1'), { size: 34, color: COL.task });
    item(p, 2, 'Гарантированная скорость: n известно до расчёта', 380, m('c2'), { size: 34, color: COL.good });
    item(p, 3, 'и не зависит от вида функции', 450, m('c2') + 1.5, { size: 34, color: COL.good });
    item(p, 4, 'Нужна только унимодальность, производная не нужна', 570, m('c3'), { size: 34, color: COL.whole });
  }],

  ['sum', 'Главное', (m) => {
    const p = panel(0);
    wrapList(p, [['x₁ = a + 0,382(b − a), x₂ = a + 0,618(b − a); f(x₁) ≤ f(x₂) ⇒ b := x₂, иначе a := x₁.', 'w1'],
      ['Оставшаяся точка делит новый отрезок так же — одно новое вычисление за итерацию.', 'w2'],
      ['k² = 1 − k, k ≈ 0,618: длина × 0,618 за шаг; n = 19 из 3·0,618ⁿ ≤ 0,0005.', 'w3'],
      ['ЛР1: [1,999868; 2,000189], x = 2,000028, 19 итераций, 21 вычисление.', 'w4']], m, { size: 30, dy: 150 });
  }],

  ['final1', 'Практика 1', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-n', prompt: ['Отрезок [0; 5], ε = 0,001. Сколько итераций даст формула из отчёта L·0,618ⁿ ≤ ε и сколько вычислений насчитает функция golden?'],
    build: numIn([{ parts: ['итераций n = ', { num: 18, tol: 0, d: 0, w: 6 }], why: 'n ≥ ln(0,001/5)/ln 0,618 ≈ 17,7 ⇒ 18.' }, { parts: ['вычислений cnt = ', { num: 20, tol: 0, d: 0, w: 6 }], why: '2 стартовых + 17 новых + 1 в середине = 20.' }]),
  }], done, 'Практика главы   1 из 3') }],

  ['final2', 'Практика 2', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-step', prompt: ['Минимизируем f(x) = (x − 1)² на [0; 4] функцией golden. Стартовые x₁ = 1,527864, x₂ = 2,472136. Что будет после первой итерации?'],
    build: numIn([{ parts: ['новое a = ', { num: 0, tol: 1e-6, w: 7 }], why: 'f(x₁) = 0,2787 < f(x₂) = 2,1672 — левый конец не меняется.' }, { parts: ['новое b = ', { num: 2.472136, tol: 2e-5 }], why: 'b := x₂ = 2,472136.' }, { parts: ['новая x1 = ', { num: 2.472136 - K * 2.472136, tol: 2e-5 }], why: 'x1 = b − k(b − a) = 2,472136 − 0,618034·2,472136 = 0,944272.' }]),
  }, {
    id: 'p-mid', prompt: ['Почему golden возвращает середину итогового отрезка, а не одну из точек x₁, x₂?'],
    build: choice(['Середина отстоит от минимума не дальше половины длины отрезка (< ε/2)', 'Так требует формула 0,618', 'В середине f всегда меньше', 'Чтобы сэкономить вычисление'], 0,
      'Минимум где-то внутри отрезка длины ≤ ε; середина ближе всего к любой его точке.',
      [null, 'Формула задаёт точки, а не ответ.', 'Не всегда — середина просто гарантирует ошибку ≤ (b − a)/2.', 'Наоборот: в середине f считается дополнительно (cnt += 1).']),
  }], done, 'Практика главы   2 из 3') }],

  ['final3', 'Практика 3', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-tf', prompt: ['Верно или неверно — по вашему отчёту и коду?'],
    build: TFQ([
      ['На каждой итерации golden вычисляет f дважды', false, 'Один раз: одна точка переходит в следующий шаг.'],
      ['Если f(x₁) ≤ f(x₂), то b := x₂', true, 'Минимум не правее x₂.'],
      ['Число итераций зависит от вида функции', false, 'Не зависит: n из L·0,618ⁿ ≤ ε известно до расчёта.'],
      ['За итерацию длина отрезка уменьшается примерно в 1,618 раза', true, '1/0,618 ≈ 1,618.'],
      ['Методу нужна производная функции', false, 'Нужна только унимодальность.'],
      ['При ε = 0,00001 вычислений 29', true, 'Таблица 3 отчёта.'],
    ]),
  }], done, 'Практика главы   3 из 3') }],

  ['finish', 'Финиш', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
