const f = OPT.FN.f1.f, K = OPT.K, FS = 2 - 2 * Math.log(2);   // f* = f(2)
const G1 = (p, o = {}) => graph(p, 'f1', { x0: 120, y0: 790, w: 800, h: 520, xs: [1, 4, .5], ys: [.5, 1.3, .1], name: 'f(x)=x-2\\ln x', ...o });
const RB = runM('brentMin', 'f1');      // ЛР1: 8 итераций, 9 вычислений — как в таблице 1 отчёта
// Листинг функции brent из отчёта (строки 68–146 файла lab1_var21.py).
const BR = `# ---------- метод 3: Брент ----------
# x - лучшая точка, w - вторая, v - третья (прошлая w)
# пробуем прыгнуть в вершину параболы через x, w, v,
# если не получается - делаем шаг золотого сечения
def brent(a, b, eps, log=None):
    tol = eps / 2
    x = w = v = a + (1 - k) * (b - a)
    fx = fw = fv = f(x)
    cnt = 1
    it = 0
    d = b - a        # последний шаг
    e = b - a        # предпоследний шаг
    while x - a > eps or b - x > eps:
        it += 1
        e_old = e
        e = d
        use_parabola = False

        # параболу можно строить только по трём разным точкам
        if x != w and w != v and x != v:
            r = (x - w) * (fx - fv)
            q = (x - v) * (fx - fw)
            p = (x - v) * q - (x - w) * r
            q = 2 * (q - r)
            if q > 0:
                p = -p
            q = abs(q)
            # вершина параболы = x + p/q
            # берём её, только если шаг меньше половины позапрошлого
            # и точка не вылезла за отрезок / не прилипла к краю
            if q != 0 and abs(p) < abs(q * e_old / 2):
                u = x + p / q
                if u - a > 2 * tol and b - u > 2 * tol:
                    d = p / q
                    use_parabola = True

        if not use_parabola:
            # шаг золотого сечения в бОльшую половину
            if x < (a + b) / 2:
                e = b - x
            else:
                e = a - x
            d = (1 - k) * e

        # совсем маленький шаг смысла не имеет, делаем хотя бы tol
        if abs(d) >= tol:
            u = x + d
        elif d > 0:
            u = x + tol
        else:
            u = x - tol

        fu = f(u)
        cnt += 1
        if log is not None:
            log.append((it, a, b, x, u, fu, "парабола" if use_parabola else "золотое"))

        # сужаем отрезок и обновляем x, w, v
        if fu <= fx:
            # нашли точку лучше x
            if u < x:
                b = x
            else:
                a = x
            v, fv = w, fw
            w, fw = x, fx
            x, fx = u, fu
        else:
            # u хуже x, но отрезок всё равно можно подрезать
            if u < x:
                a = u
            else:
                b = u
            if fu <= fw or w == x:
                v, fv = w, fw
                w, fw = u, fu
            elif fu <= fv or v == x or v == w:
                v, fv = u, fu
    return x, fx, it, cnt`.split('\n');
const brL = (from, to) => BR.slice(from - 68, to - 68 + 1);

// ---- помощники главы: «лупа» (график с подписями осей любой точности) и прогон Брента с подписями без наложений ----
function zgraph(p, { x0 = 110, y0 = 790, w = 740, h = 520, xs, ys, lx, ly, xl = 'x', yl, name, t0 = .2 }) {
  const [xlo, xhi, xst] = xs, [ylo, yhi, yst] = ys;
  const PX = v => x0 + (v - xlo) / (xhi - xlo) * w, PY = v => y0 - (v - ylo) / (yhi - ylo) * h, g = G(p, { o: 0 });
  const nx = Math.round((xhi - xlo) / xst), ny = Math.round((yhi - ylo) / yst);
  let d = '';
  for (let i = 1; i <= nx; i++) d += `M${PX(xlo + i * xst)} ${y0}V${y0 - h}`;
  for (let i = 1; i <= ny; i++) d += `M${x0} ${PY(ylo + i * yst)}H${x0 + w}`;
  mk('path', { d, stroke: COL.chalk, 'stroke-opacity': .1, 'stroke-width': 1.5, fill: 'none' }, g);
  path(g, `M${x0} ${y0 - h - 20}V${y0}H${x0 + w + 20}`, { stroke: COL.chalk, 'stroke-width': 3 });
  for (let i = 0; i <= nx; i++) T(g, lx(xlo + i * xst), { x: PX(xlo + i * xst), y: y0 + 30, size: 19, fill: COL.dim, font: MATH, anchor: 'middle' });
  for (let i = 0; i <= ny; i++) T(g, ly(ylo + i * yst), { x: x0 - 14, y: PY(ylo + i * yst) + 7, size: 20, fill: COL.dim, font: MATH, anchor: 'end' });
  T(g, xl, { x: x0 + w + 34, y: y0 + 8, size: 26, fill: COL.dim, font: MATH });
  if (yl) T(g, yl, { x: x0 - 30, y: y0 - h - 34, size: 24, fill: COL.dim, font: MATH });
  show(g, t0);
  const id = 'zc' + Math.random().toString(36).slice(2, 8);
  const cp = mk('clipPath', { id }, p); mk('rect', { x: x0, y: y0 - h - 6, width: w + 4, height: h + 12 }, cp);
  const layer = mk('g', { 'clip-path': `url(#${id})` }, p), top = mk('g', {}, p);
  const Gr = { p, F: OPT.FN.f1, f, PX, PY, x0, y0, w, h, xs, ys, layer, top, back: mk('g', {}, layer) };
  Gr.curve = curve(Gr, f, t0 + .3, { sw: 4.5, dur: 1.2 });
  if (name) tex(p, name, x0 + 120, y0 - h - 110, t0 + .5, { size: 28, color: COL.dim });
  return Gr;
}
const fxd = (d) => v => v.toFixed(d).replace('.', ',');
// Шаги Брента: точки с одинаковым x — одна подпись «x=w=v», близкие подписи уходят ниже, точки вне лупы не рисуются.
function animB(Gr, R, { from, to, ts, B }) {
  const [lo, hi] = Gr.xs, s0 = R.steps[from];
  B = B || band(Gr, s0.a, s0.b, ts[0]);
  let prev = [];
  for (let k = from; k <= to; k++) {
    const s = R.steps[k], t = ts[k - from];
    if (k > from) moveBand(Gr, B, s.a, s.b, t);
    prev.forEach(e => hide(e, t, .3)); prev = [];
    const gs = [];
    s.pts.forEach(q => {
      if (q.x < lo || q.x > hi) return;
      const g0 = gs.find(g => Math.abs(g.x - q.x) < 1e-12);
      if (g0) g0.l += '=' + q.l; else gs.push({ ...q });
    });
    gs.sort((a, b) => a.x - b.x);
    const right = [-1e9, -1e9, -1e9];   // правый край последней подписи на каждом уровне
    gs.forEach(g => {
      const X = Gr.PX(g.x), hw = 9 * g.l.length + 6;
      let lvl = right.findIndex(r => X - hw > r); if (lvl < 0) lvl = 2;
      right[lvl] = X + hw;
      prev.push(fdot(Gr, g.x, t + .25, { color: PT_COL[g.c], label: g.l, y: g.y, ly: 34 + lvl * 28 }));
    });
    if (s.par) prev.push(parab(Gr, s.par.map(v => v[0]), t + .3, { ys3: s.par.map(v => v[1]) }));
  }
  Gr.B = B;
  return prev;
}

const brow = k => { const r = RB.steps[k].row; return [String(r[0]), ...r.slice(1, 5).map(v => fxd(6)(v)), KIND(r[6])]; };

function notes(p, list, ts, { x = 940, y = 640, size = 25 } = {}) {

}
// Разбор листинга: подсветка строк + пояснение справа (текст и, если нужно, формула); прошлое пояснение гаснет.
function codeWalk(p, cb, { x = 1110, y = 200, w = 440 } = {}) {
  let prev = [];
  return (from, to, t, txt, col = COL.task, formula) => {
    prev.forEach(e => hide(e, t, .3));
    const r = codeHl(cb, from, to, t, { color: col });
    const tx = para(p, txt, x, y, t + .2, { w, size: 26 });
    prev = [r, tx];
    if (formula) prev.push(tex(p, formula, x, y + tx._h + 10, t + .5, { size: 30, color: col, w }));
    return prev;
  };
}
