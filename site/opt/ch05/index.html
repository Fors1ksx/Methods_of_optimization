const LAB = `import math

# вариант 21: f(x) = x - 2ln(x), отрезок [1, 4], точность 0.0005
a0 = 1.0
b0 = 4.0
eps = 0.0005

k = (math.sqrt(5) - 1) / 2   # золотое число, ~0.618


def f(x):
    return x - 2 * math.log(x)


# ---------- метод 1: равномерный поиск ----------
# просто идём по сетке с шагом eps и запоминаем, где f меньше всего
def uniform(a, b, eps):
    n = round((b - a) / eps)      # сколько шагов
    h = (b - a) / n
    x_best = a
    f_best = f(a)
    cnt = 1                       # счётчик вычислений f
    for i in range(1, n + 1):
        x = a + i * h
        fx = f(x)
        cnt += 1
        if fx < f_best:
            x_best = x
            f_best = fx
    return x_best, f_best, n + 1, cnt   # тут итерация = одно вычисление


# ---------- метод 2: золотое сечение ----------
def golden(a, b, eps):
    x1 = b - k * (b - a)          # левая точка (38.2% от a)
    x2 = a + k * (b - a)          # правая точка (61.8% от a)
    f1 = f(x1)
    f2 = f(x2)
    cnt = 2
    it = 0
    while True:
        it += 1
        if f1 <= f2:
            # справа от x2 минимума нет -> выкидываем [x2, b]
            b = x2
            # старая x1 как раз оказывается на месте новой x2, f не пересчитываем
            x2 = x1
            f2 = f1
            if b - a <= eps:
                break
            x1 = b - k * (b - a)
            f1 = f(x1)
        else:
            # слева от x1 минимума нет -> выкидываем [a, x1]
            a = x1
            x1 = x2
            f1 = f2
            if b - a <= eps:
                break
            x2 = a + k * (b - a)
            f2 = f(x2)
        cnt += 1
    x = (a + b) / 2               # ответ - середина того, что осталось
    cnt += 1
    return x, f(x), it, cnt


# ---------- метод 3: Брент ----------
# x - лучшая точка, w - вторая, v - третья (прошлая w)
# пробуем прыгнуть в вершину параболы через x, w, v,
# если не получается - делаем шаг золотого сечения
def brent(a, b, eps, log=None):
    tol = eps / 2
    x = w = v = a + (1 - k) * (b - a)
    fx = fw = fv = f(x)
    cnt = 1
    it = 0
    d = b - a        # последний шаг
    e = b - a        # предпоследний шаг
    while x - a > eps or b - x > eps:
        it += 1
        e_old = e
        e = d
        use_parabola = False

        # параболу можно строить только по трём разным точкам
        if x != w and w != v and x != v:
            r = (x - w) * (fx - fv)
            q = (x - v) * (fx - fw)
            p = (x - v) * q - (x - w) * r
            q = 2 * (q - r)
            if q > 0:
                p = -p
            q = abs(q)
            # вершина параболы = x + p/q
            # берём её, только если шаг меньше половины позапрошлого
            # и точка не вылезла за отрезок / не прилипла к краю
            if q != 0 and abs(p) < abs(q * e_old / 2):
                u = x + p / q
                if u - a > 2 * tol and b - u > 2 * tol:
                    d = p / q
                    use_parabola = True

        if not use_parabola:
            # шаг золотого сечения в бОльшую половину
            if x < (a + b) / 2:
                e = b - x
            else:
                e = a - x
            d = (1 - k) * e

        # совсем маленький шаг смысла не имеет, делаем хотя бы tol
        if abs(d) >= tol:
            u = x + d
        elif d > 0:
            u = x + tol
        else:
            u = x - tol

        fu = f(u)
        cnt += 1
        if log is not None:
            log.append((it, a, b, x, u, fu, "парабола" if use_parabola else "золотое"))

        # сужаем отрезок и обновляем x, w, v
        if fu <= fx:
            # нашли точку лучше x
            if u < x:
                b = x
            else:
                a = x
            v, fv = w, fw
            w, fw = x, fx
            x, fx = u, fu
        else:
            # u хуже x, но отрезок всё равно можно подрезать
            if u < x:
                a = u
            else:
                b = u
            if fu <= fw or w == x:
                v, fv = w, fw
                w, fw = u, fu
            elif fu <= fv or v == x or v == w:
                v, fv = u, fu
    return x, fx, it, cnt


# ---------- запуск ----------
