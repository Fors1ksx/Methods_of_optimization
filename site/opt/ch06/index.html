<!doctype html>
<html lang="ru">
<head>

<title>ЛР2: постановка и точный ответ</title>
<link rel="stylesheet" href="../lib/engine.css">

<body>
<script src="../lib/engine.js"></script>
<script src="../lib/math.js"></script>
<script src="../lib/board.js"></script>
<script src="../lib/katex/katex.min.js"></script>
<script src="../lib/methods.js"></script>
<script src="../lib/opt.js"></script>
<script src="audio/ru/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 6, title: 'ЛР2: постановка и точный ответ', minutes: 10, language: 'ru', next: '../ch07/' };
const P2 = OPT.FN.phi2, dphi = P2.df, d2f = x => -P2.d2(x);
// Стандартный график f варианта 21 (ЛР2) слева.
const GF = (p, o = {}) => graph(p, 'f2', { x0: 120, y0: 790, w: 720, h: 520, xs: [2, 6, .5], ys: [7, 11, .5], name: 'f(x)=5x^2e^{-x/2}', ...o });
// Пунктирная горизонталь y = 0 на графике.
function ch6Zero(Gr, t0) {
  const l = path(Gr.layer, `M${Gr.PX(Gr.xs[0])} ${Gr.PY(0)}H${Gr.PX(Gr.xs[1])}`, { stroke: COL.dim, 'stroke-width': 2, 'stroke-dasharray': '6 6' }, { o: 0 });
  show(l, t0);
  return l;
}
// Строки листинга отчёта (lab2_var21.py), номера — как в отчёте.
const CH6_FPHI = ['def f(x):', '    return 5 * x * x * math.exp(-x / 2)', '', '', 'def phi(x):', '    return -f(x)'];   // 9–14
const CH6_DPHI = ['def dphi(x):', "    # phi'(x) = -5e^(-x/2) * (2x - x^2/2)", '    return -5 * math.exp(-x / 2) * (2 * x - x * x / 2)'];   // 17–19

const BEATS = [
  ['intro', 'Глава 6', (m, D) => introCard(m, D, 'ЛР2 · Глава 6', 'ЛР2: постановка и точный ответ', 'максимум f → минимум φ = −f · аналитика · эталон x* = 4')],

  ['goal', 'Цель и постановка', (m) => {
    const p = panel(0);
    kick(p, '6.1 · Цель работы и постановка задачи');
    say(p, 'Цель работы', 120, 190, m('goal'), { size: 26, fill: COL.dim, weight: 600 });
    para(p, 'Приобретение практических навыков решения задач одномерной минимизации численными методами.', 120, 240, m('goal') + .2, { w: 1360, size: 34 });
    say(p, 'Вариант 21', 120, 380, m('task'), { size: 26, fill: COL.dim, weight: 600 });
    tex(p, 'f(x)=5x^2e^{-x/2}\\ \\to\\ \\max', 120, 400, m('task') + .2, { size: 52 });
    tex(p, 'x\\in[2;\\,6]', 760, 400, m('seg'), { size: 52, color: COL.whole });
    tex(p, '\\varepsilon=0,002', 1120, 400, m('eps'), { size: 52, color: COL.task });
    tag(p, '№ 3 · метод касательных', 440, 570, OC.x2, m('meth'), { size: 32, solid: true });
    tag(p, '№ 4 · метод Брента', 1040, 570, COL.whole, m('meth') + .5, { size: 32, solid: true });
    tag(p, 'точку максимума найти аналитически', 740, 660, COL.good, m('exact'), { size: 28 });
    say(p, 'сравнить:', 120, 770, m('cmp'), { size: 28, fill: COL.dim, weight: 600 });
    tagRow(p, ['вычисления функции и производной', 'число итераций', 'погрешность'], 270, 760, COL.task, m('cmp') + .2, { size: 26, dt: .6, gap: 18 });
  }],

  ['maxmin', 'max f → min φ', (m) => {
    const p = panel(0);
    kick(p, '6.2 · Методы ищут минимум: φ(x) = −f(x)');
    const gt = graph(p, 'f2', { x0: 120, y0: 420, w: 720, h: 250, xs: [2, 6, .5], ys: [7, 11, 1], yl: '', name: 'f(x)', t0: .2 });
    const gb = graph(p, 'phi2', { x0: 120, y0: 800, w: 720, h: 250, xs: [2, 6, .5], ys: [-11, -7, 1], yl: '', t0: m('flip') });
    tex(p, '\\varphi(x)', 820, 545, m('flip') + .5, { size: 30, color: COL.task, anchor: 'end', w: 300 });
    vline(gt, 4, m('same'), { color: COL.good });
    fdot(gt, 4, m('same'), { color: COL.good, drop: false });
    say(p, 'max', gt.PX(4) + 22, gt.PY(10.83) + 36, m('same'), { size: 26, fill: COL.good, weight: 700 });
    vline(gb, 4, m('same') + .3, { color: COL.good });
    fdot(gb, 4, m('same') + .3, { color: COL.good, drop: false });
    say(p, 'min', gb.PX(4) + 22, gb.PY(-10.83) - 16, m('same') + .3, { size: 26, fill: COL.good, weight: 700 });
    const X = 900;
    tag(p, 'оба метода ищут минимум', X + 210, 175, COL.bad, m('min'), { size: 26 });
    tex(p, '\\varphi(x)=-f(x)=-5x^2e^{-x/2}', X, 225, m('flip'), { size: 36, color: COL.task });
    tex(p, '\\arg\\max f=\\arg\\min\\varphi', X, 305, m('same') + .5, { size: 36 });
    tex(p, '\\max f=-\\min\\varphi', X, 385, m('val'), { size: 44, color: COL.good });
    const cb = codeBlock(p, CH6_FPHI, X, 530, m('code'), { first: 9, w: 600, size: 22, title: 'lab2_var21.py' });
    codeHl(cb, 13, 14, m('code') + 2.5);
  }],

  ['q1', 'Проверка: max и min', () => {
    const p = panel(0); kick(p, 'Проверка');
    tex(p, '\\varphi(x)=-f(x)', 120, 200, .3, { size: 50, color: COL.task });
    tex(p, '\\max f=-\\min\\varphi', 120, 320, .5, { size: 50, color: COL.good });
    tex(p, 'x^*\\ \\text{— одна и та же точка}', 120, 440, .7, { size: 40 });
  }, { ask: done => quiz(QR, [{
    id: 'c-why', prompt: ['Почему в ЛР2 вместо максимума f ищется минимум φ = −f?'],
    build: choice(['Оба метода (касательных и Брента) ищут минимум', 'Функция f на [2; 6] не дифференцируема', 'Так получается меньшая погрешность', 'У f на [2; 6] нет максимума'], 0,
      'Так в §2 отчёта: точка у f и φ одна и та же, а max f = −min φ.',
      [null, 'f дифференцируема всюду — это произведение многочлена и экспоненты.', 'Погрешность от замены f на −f не меняется.', 'Максимум есть — в точке x = 4.']),
  }, {
    id: 'c-val', prompt: ['Программа минимизации нашла min φ = −7,5 в точке x = 1,2. Запишите точку максимума f и сам максимум.'],
    build: numIn([{ parts: ['x* = ', { num: 1.2, tol: 1e-6, d: 1, w: 6 }], why: 'Точка не меняется: x* = 1,2.' }, { parts: ['max f = ', { num: 7.5, tol: 1e-6, d: 1, w: 6 }], why: 'max f = −min φ = −(−7,5) = 7,5.' }]),
  }], done) }],

  ['graph', 'График', (m) => {
    const p = panel(0);
    kick(p, '6.3 · График функции на [2; 6] (рисунок 1 отчёта)');
    const g = GF(p);
    vline(g, 4, m('one'), { color: COL.good, label: '≈ 4' });
    fdot(g, 4, m('one') + .3, { color: COL.good, drop: false });
    const X = 960;
    para(p, 'Один максимум, примерно в x = 4.', X, 175, m('one'), { w: 580, size: 28 });
    para(p, 'График выпуклый вверх.', X, 235, m('up'), { w: 580, size: 28 });
    tex(p, '\\Rightarrow\\ \\varphi=-f\\ \\text{выпуклая, минимум один}', X, 270, m('phi'), { size: 30, color: COL.task });
    const gp = graph(p, 'phi2', { x0: 1000, y0: 740, w: 500, h: 270, xs: [2, 6, 1], ys: [-11, -7, 1], yl: '', name: '\\varphi(x)', nameColor: COL.task, t0: m('phi') + .3 });
    tangent(gp, 2.9, m('tan'));
    tangent(gp, 5.0, m('tan') + .5);
    fdot(gp, 2.9, m('tan'), { color: OC.tan, drop: false, r: 9 });
    fdot(gp, 5.0, m('tan') + .5, { color: OC.tan, drop: false, r: 9 });
    say(p, 'касательная не выше графика', 1250, 850, m('tan') + .8, { size: 26, fill: OC.tan, weight: 600, anchor: 'middle' });
    tag(p, 'на глаз → дальше проверим аналитически', X + 260, 390, COL.dim, m('check'), { size: 24 });
  }],

  ['deriv', 'Необходимое условие', (m) => {
    const p = panel(0);
    kick(p, '6.4 · Аналитическое решение: f′(x) = 0');
    const g = GF(p, { name: undefined });
    tangent(g, 4, m('zero') + 1, { color: COL.task });
    fdot(g, 4, m('in'), { color: COL.good, label: 'x = 4' });
    const X = 900;
    texRows(p, [
      "f'(x)=5e^{-x/2}\\left(2x-\\tfrac{x^2}{2}\\right)",
      "\\phantom{f'(x)}=5x\\,e^{-x/2}\\left(2-\\tfrac{x}{2}\\right)",
      "f'(x)=0:\\ \\ x=0\\ \\text{или}\\ x=4",
    ], X, 170, [m('d1'), m('fac'), m('zero')], { size: 36, dy: 120 });
    tex(p, 'e^{-x/2}>0\\ \\text{— в ноль не обращается}', X, 525, m('zero'), { size: 30, color: COL.dim });
    tex(p, 'x=4\\in[2;\\,6],\\qquad x=0\\notin[2;\\,6]', X, 610, m('in'), { size: 34, color: COL.good });
  }],

  ['d2', 'Достаточное условие', (m) => {
    const p = panel(0);
    kick(p, '6.5 · Достаточное условие: знак f″(4)');
    texRows(p, [
      "f''(x)=5e^{-x/2}\\left(\\tfrac{x^2}{4}-2x+2\\right)",
      "f''(4)=5e^{-2}\\,(4-8+2)",
      "\\phantom{f''(4)}=-10e^{-2}\\approx-1,353<0",
    ], 120, 180, [m('f2'), m('at4'), m('val')], { size: 46, dy: 140, color: [COL.chalk, COL.chalk, COL.task] });
    const g = graph(p, 'f2', { x0: 1000, y0: 780, w: 500, h: 280, xs: [2, 6, 1], ys: [7, 11, 1], yl: '', t0: m('at4') });
    fdot(g, 4, m('neg'), { color: COL.good, label: 'max' });
    tag(p, 'f″(4) < 0 ⇒ в x = 4 максимум', 500, 700, COL.good, m('neg'), { size: 32, solid: true });
  }],

  ['whole', 'Знак f″ на всём отрезке', (m) => {
    const p = panel(0);
    kick(p, '6.6 · f″ < 0 на всём [2; 6] ⇒ φ выпуклая');
    const g = graph(p, d2f, { x0: 120, y0: 790, w: 720, h: 520, xs: [0, 8, 1], ys: [-2.5, 1.5, .5], yl: "f''(x)" });
    ch6Zero(g, .5);
    band(g, 2, 6, m('why'));
    fdot(g, 4, m('why') + .3, { color: COL.task, label: '4' });
    fval(g, 4, '−1,353', m('why') + .5, { color: COL.task, dy: 44, dx: 18 });
    vline(g, 4 - 2 * Math.SQRT2, m('roots') + 3, { color: COL.bad, label: '1,172' });
    vline(g, 4 + 2 * Math.SQRT2, m('roots') + 5, { color: COL.bad, label: '6,828' });
    say(p, 'f″ < 0', g.PX(4), g.PY(-.5), m('out'), { size: 34, fill: COL.good, weight: 700, anchor: 'middle' });
    const X = 900;
    para(p, 'Знак f″(4) — только около x = 4. Методам нужна выпуклость φ на всём отрезке.', X, 175, m('why'), { w: 640, size: 28, fill: COL.dim });
    tex(p, '\\tfrac{x^2}{4}-2x+2=0', X, 290, m('roots'), { size: 36 });
    tex(p, 'x=4\\pm2\\sqrt2\\approx1,172;\\ \\ 6,828', X, 370, m('roots') + 3, { size: 36, color: COL.bad });
    tex(p, "[2;\\,6]\\ \\text{между корнями}\\ \\Rightarrow\\ f''<0", X, 470, m('out'), { size: 34 });
    tex(p, 'f\\ \\text{выпукла вверх},\\ \\ \\varphi=-f\\ \\text{выпуклая}', X, 580, m('concl'), { size: 34, color: COL.good });
    tag(p, 'это нужно методам с производной', X + 320, 740, COL.good, m('concl') + 2, { size: 28, solid: true });
  }],

  ['q2', 'Проверка: f″', () => {
    const p = panel(0); kick(p, 'Проверка');
    tex(p, "f''(x)=5e^{-x/2}\\left(\\tfrac{x^2}{4}-2x+2\\right)", 120, 200, .3, { size: 40 });
    tex(p, 'e^{-2}\\approx0,135335', 120, 330, .5, { size: 36, color: COL.dim });
    tex(p, '\\sqrt2\\approx1,414214', 120, 420, .6, { size: 36, color: COL.dim });
  }, { ask: done => quiz(QR, [{
    id: 'c-d2', prompt: ['Посчитайте по формуле отчёта (3 знака после запятой).'],
    build: numIn([{ parts: ['f″(4) = ', { num: -10 * Math.exp(-2), tol: 1.5e-3, d: 3, w: 8 }], why: '5e⁻²·(4 − 8 + 2) = −10e⁻² ≈ −1,353.' }, { parts: ['меньший корень f″: x = ', { num: 4 - 2 * Math.SQRT2, tol: 1.5e-3, d: 3, w: 8 }], why: '4 − 2√2 ≈ 4 − 2,828 = 1,172 — левее отрезка.' }]),
  }, {
    id: 'c-whole', prompt: ['Зачем в отчёте искали нули f″, если f″(4) < 0 уже доказывает максимум?'],
    build: choice(['Чтобы убедиться, что f″ < 0 на всём [2; 6], то есть φ выпуклая', 'Чтобы найти саму точку максимума', 'Чтобы посчитать f(2) и f(6)', 'Чтобы выбрать ε'], 0,
      'Корни 1,172 и 6,828 лежат вне [2; 6], поэтому знак f″ на отрезке не меняется.',
      [null, 'Точку дал корень f′: x = 4.', 'Значения на концах считаются по самой f.', 'ε задано в постановке: 0,002.']),
  }], done) }],

  ['ends', 'Концы и эталон', (m) => {
    const p = panel(0);
    kick(p, '6.7 · Значения на концах: максимум глобальный');
    const g = GF(p);
    fdot(g, 2, m('f2'), { color: OC.x1, label: '2' });
    fval(g, 2, '7,3576', m('f2') + .2, { color: OC.x1, dy: -24 });
    fdot(g, 6, m('f6'), { color: OC.x1, label: '6' });
    fval(g, 6, '8,9617', m('f6') + .2, { color: OC.x1, dy: 40, dx: -18, anchor: 'end' });
    fdot(g, 4, m('top'), { color: COL.good, label: '4' });
    fval(g, 4, '10,826823', m('top') + .2, { color: COL.good, dy: -28, dx: 0, anchor: 'middle' });
    const X = 900;
    texRows(p, ['f(2)=20e^{-1}\\approx7,3576', 'f(6)=180e^{-3}\\approx8,9617', 'f(4)=80e^{-2}\\approx10,826823'], X, 170,
      [m('f2'), m('f6'), m('top')], { size: 38, dy: 100, color: [OC.x1, OC.x1, COL.good] });
    tag(p, 'f(2), f(6) < f(4) ⇒ максимум глобальный', X + 320, 520, COL.good, m('top') + 2, { size: 26 });
    show(boxR(p, X - 10, 602, 640, 108, { stroke: COL.good, sw: 3 }), m('ans'));
    tex(p, 'x^*=4,\\qquad f(x^*)=80e^{-2}\\approx10,826823', X + 10, 650, m('ans') + .2, { size: 34, color: COL.good });
  }],

  ['dphi', 'Знаки φ′ на концах', (m) => {
    const p = panel(0);
    kick(p, "6.8 · Производная φ: разные знаки на концах, корень один");
    const g = graph(p, dphi, { x0: 120, y0: 790, w: 720, h: 520, xs: [2, 6, .5], ys: [-4, 2, 1], yl: "φ′(x)" });
    ch6Zero(g, .5);
    fdot(g, 2, m('left'), { color: OC.x1, label: '' });
    fval(g, 2, '−3,679', m('left') + .2, { color: OC.x1, dy: 8 });
    fdot(g, 6, m('right'), { color: OC.x2, label: '' });
    fval(g, 6, '1,494', m('right') + .2, { color: OC.x2, dx: -18, anchor: 'end', dy: 36 });
    fdot(g, 4, m('root'), { color: COL.good, label: '' });
    vline(g, 4, m('ref'), { color: COL.good, label: 'x* = 4' });
    const X = 880;
    tex(p, "\\varphi'(x)=-5e^{-x/2}\\left(2x-\\tfrac{x^2}{2}\\right)", X, 150, m('form'), { size: 32 });
    const cb = codeBlock(p, CH6_DPHI, X + 10, 250, m('form') + 2, { first: 17, w: 660, size: 18 });
    codeHl(cb, 19, 19, m('form') + 4);
    tex(p, "\\varphi'(2)=-10e^{-1}\\approx-3,679<0", X, 400, m('left'), { size: 32, color: OC.x1 });
    tex(p, "\\varphi'(6)=30e^{-3}\\approx1,494>0", X, 470, m('right'), { size: 32, color: OC.x2 });
    tex(p, "\\text{корень }\\varphi'\\text{ на }[2;\\,6]\\text{ один: }x=4", X, 560, m('root'), { size: 32 });
    tag(p, 'эталон для сравнения методов', X + 320, 700, COL.good, m('ref'), { size: 28, solid: true });
  }],

  ['sign', 'Ловушка со знаком', (m) => {
    const p = panel(0);
    kick(p, '6.9 · Ловушка: знак значения в ответе');
    say(p, 'метод касательных останавливается в c = 4,000764', 120, 190, m('run'), { size: 28, fill: COL.dim });
    tex(p, '\\varphi(c)=-10,826822', 120, 230, m('run') + .5, { size: 44 });
    tex(p, '\\max f=-10,826822\\ ?', 760, 230, m('wrong'), { size: 44, color: COL.bad });
    tex(p, '\\text{Но }f=5x^2e^{-x/2}>0\\ \\text{на всём }[2;\\,6]', 780, 320, m('wrong') + 1.5, { size: 30, color: COL.dim });
    codeBlock(p, ['    return c, -fc, it, cnt'], 120, 470, m('code'), { first: 46, w: 640, size: 26, title: 'метод касательных' });
    tex(p, '\\max f=-\\varphi(c)=10,826822', 860, 465, m('code') + 1, { size: 40, color: COL.good });
    codeBlock(p, ['    # плюс одно вычисление самой функции в найденной точке для ответа', '    return b, f(b), it, cnt + 1'], 120, 640, m('brent'), { first: 119, w: 1000, size: 22, title: 'метод Брента' });
    tag(p, 'сразу f(b)', 1300, 700, COL.good, m('brent') + 1, { size: 26 });
    tag(p, 'x — как есть,  значение — со сменой знака', 800, 845, COL.task, m('rule'), { size: 30, solid: true });
  }],

  ['sum', 'Главное', (m) => {
    const p = panel(0);
    wrapList(p, [['max f ищется как min φ, φ = −f: точка та же, у значения меняем знак.', 'w1'],
      ['f′ = 5x·e^(−x/2)(2 − x/2) = 0 ⇒ x = 4; f″(4) = −10e⁻² ≈ −1,353 < 0 — максимум.', 'w2'],
      ['Нули f″: 4 ± 2√2 ≈ 1,172 и 6,828 — вне [2; 6], поэтому φ выпуклая на всём отрезке.', 'w3'],
      ['Эталон: x* = 4, f* = 80e⁻² ≈ 10,826823; φ′(2) < 0 < φ′(6).', 'w4']], m, { size: 32 });
  }],

  ['final1', 'Практика 1', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-at3', prompt: ['По формулам отчёта посчитайте значения в точке x = 3 (4 знака после запятой): f(3) = 5·9·e^(−1,5) и φ′(3) = −5e^(−1,5)·(2·3 − 9/2).'],
    build: numIn([
      { parts: ['f(3) = ', { num: 45 * Math.exp(-1.5), tol: 2e-4, d: 4, w: 9 }], why: '45·e^(−1,5) = 45·0,223130 ≈ 10,0409.' },
      { parts: ['φ′(3) = ', { num: dphi(3), tol: 2e-4, d: 4, w: 9 }], why: '−5·0,223130·1,5 ≈ −1,6735.' },
    ]),
  }, {
    id: 'p-side', prompt: ['φ′(3) < 0. Где лежит минимум выпуклой φ относительно x = 3?'],
    build: choice(['правее x = 3', 'левее x = 3', 'ровно в x = 3', 'по одному знаку сказать нельзя'], 0,
      'φ в точке 3 убывает, у выпуклой функции минимум тогда правее — и правда x* = 4.',
      [null, 'Слева φ ещё больше: она убывает к минимуму.', 'В минимуме φ′ = 0, а здесь φ′ < 0.', 'Для выпуклой φ знака производной достаточно.']),
  }], done, 'Практика главы   1 из 3') }],

  ['final2', 'Практика 2', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-d2ends', prompt: ['Проверьте знак f″(x) = 5e^(−x/2)(x²/4 − 2x + 2) на концах отрезка (4 знака после запятой).'],
    build: numIn([
      { parts: ['f″(2) = ', { num: d2f(2), tol: 2e-4, d: 4, w: 9 }], why: '5e⁻¹·(1 − 4 + 2) = −5/e ≈ −1,8394.' },
      { parts: ['f″(6) = ', { num: d2f(6), tol: 2e-4, d: 4, w: 9 }], why: '5e⁻³·(9 − 12 + 2) = −5e⁻³ ≈ −0,2489.' },
    ]),
  }, {
    id: 'p-ret', prompt: ['В методе касательных fc = φ(c) = −10,826822. Строка 46: return c, -fc, it, cnt. Какое значение f программа напечатает (6 знаков)?'],
    build: numIn([{ parts: ['f = ', { num: 10.826822, tol: 1e-6, d: 6, w: 10 }], why: '−fc = −(−10,826822) = 10,826822.' }]),
  }], done, 'Практика главы   2 из 3') }],

  ['final3', 'Практика 3', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-which', prompt: ['Вариант 21. К какой функции относится утверждение: к f (ищем max) или к φ = −f (ищем min)?'],
    build: grid([
      { parts: ['значение в оптимуме ≈ 10,826823'], ans: ['f'], why: 'Это максимум f.' },
      { parts: ['значение в оптимуме ≈ −10,826823'], ans: ['p'], why: 'Это минимум φ.' },
      { parts: ['оптимум в точке x = 4'], ans: ['f', 'p'], why: 'Точка у обеих функций общая.' },
      { parts: ['выпуклая на [2; 6] (касательная не выше графика)'], ans: ['p'], why: 'φ″ = −f″ > 0; f выпукла вверх.' },
      { parts: ['производная на концах: −3,679 и 1,494'], ans: ['p'], why: 'Это φ′(2) и φ′(6).' },
      { parts: ['её минимизируют методы касательных и Брента'], ans: ['p'], why: 'Оба метода ищут минимум.' },
    ], [['f', 'f (max)', COL.whole, '1'], ['p', 'φ (min)', COL.task, '2']], { multi: true, text: true }),
  }], done, 'Практика главы   3 из 3') }],

  ['finish', 'Финиш', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
