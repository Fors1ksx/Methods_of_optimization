<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>К защите</title>
<link rel="stylesheet" href="../lib/pages.css">
<link rel="stylesheet" href="../lib/katex/katex.min.css">
<link rel="stylesheet" href="../lib/extras.css">
</head>
<body>
<header class="top" id="top"></header>
<main class="page">
  <p class="kicker">Подготовка</p>
  <h1>К <i>защите</i></h1>
  <p class="lede">Вопросы по содержанию ваших отчётов ЛР1 и ЛР2, ответы — по тексту отчётов. Прочитайте вопрос, ответьте вслух, потом откройте эталон. Отмечайте «знаю» — останутся только слабые места.</p>
  <div class="prow" id="flt" style="margin-bottom:12px"></div>
  <div class="stats" id="st"></div>
  <div id="list"></div>
  <h2>Разделы вашего отчёта — могу рассказать каждый</h2>
  <div id="chk"></div>
</main>
<script src="../lib/pages.js"></script>
<script src="../lib/katex/katex.min.js"></script>
<script src="../lib/book.js"></script>
<script>
'use strict';
topBar('defense');
const Q = [   // [ЛР (0 — обе), вопрос, ответ по отчёту, глава]
  [1, 'Сформулируйте задачу ЛР1 (вариант 21).', String.raw`Найти безусловный минимум $f(x)=x-2\ln x$ на $[1;4]$ с точностью $\varepsilon=0{,}0005$ методами равномерного поиска (№ 1), золотого сечения (№ 5) и Брента (№ 9); найти минимум аналитически и сравнить методы по числу итераций и вычислений функции.`, 1],
  [1, 'Почему по графику функция унимодальна и зачем это нужно?', String.raw`На отрезке один минимум: слева $f$ убывает, справа растёт. Тогда по двум значениям можно выбросить часть отрезка, где минимума нет.`, 1],
  [1, 'Найдите минимум аналитически.', String.raw`$f'=1-2/x=0\Rightarrow x=2\in[1;4]$. $f''=2/x^2$, $f''(2)=0{,}5>0$ — минимум; $f''>0$ при $x>0$ — функция выпукла, минимум единственный. $f(1)=1$, $f(4)\approx1{,}2274$ больше $f(2)$ — минимум глобальный: $x^*=2$, $f^*=2-2\ln2\approx0{,}613706$.`, 1],
  [1, 'Как работает равномерный поиск в вашей программе?', String.raw`Сетка с шагом $h=\varepsilon=0{,}0005$: $N=6000$ интервалов, 6001 узел $x_i=1+i\,h$; $f$ считается в каждом, ответ — узел с минимальным значением. Ошибка не больше $h$.`, 2],
  [1, 'Почему у равномерного поиска итераций столько же, сколько вычислений?', 'Метод пассивный: точки не зависят от предыдущих результатов, поэтому одна итерация — одно вычисление функции (6001 и 6001).', 2],
  [1, 'Почему равномерный поиск дал ровно x = 2,000000?', String.raw`Случайно: при $h=0{,}0005$ минимум совпал с узлом сетки, $1+2000\cdot0{,}0005=2$. В общем случае погрешность была бы до $h$.`, 2],
  [1, 'Когда равномерный поиск всё-таки полезен (вывод отчёта)?', String.raw`Для точных вычислений он невыгоден (растёт как $1/\varepsilon$), зато годится, когда функция не унимодальна и нужно сначала грубо найти область минимума.`, 2],
  [1, 'Где ставятся точки в золотом сечении и как сужается отрезок?', String.raw`$x_1=a+0{,}382(b-a)$, $x_2=a+0{,}618(b-a)$. Если $f(x_1)\le f(x_2)$ — минимум не правее $x_2$, $b:=x_2$; иначе $a:=x_1$.`, 3],
  [1, 'В чём главное свойство золотого сечения?', String.raw`Оставшаяся внутренняя точка снова делит новый отрезок в той же пропорции, поэтому на итерации вычисляется только одна новая точка, а длина уменьшается в $1/0{,}618\approx1{,}618$ раза. Это возможно при $k^2=1-k$, $k=(\sqrt5-1)/2$.`, 3],
  [1, 'Откуда 19 итераций?', String.raw`$3\cdot0{,}618^n\le0{,}0005\Rightarrow n\ge18{,}1$, $n=19$ — известно заранее.`, 3],
  [1, 'Откуда 21 вычисление у золотого сечения?', 'Две в начальных точках, по одной новой на каждой из следующих 18 итераций (на последней новая точка не нужна) и одно в середине итогового отрезка.', 3],
  [1, 'Какой отрезок остался и какой ответ?', String.raw`$[1{,}999868;\ 2{,}000189]$ длиной $0{,}000321<\varepsilon$; середина $x=2{,}000028$, $f=0{,}6137056391$.`, 3],
  [1, 'Зачем в функции golden строки x2 = x1 и f2 = f1?', String.raw`Старая $x_1$ оказывается на месте новой $x_2$ — её значение уже известно, $f$ не пересчитывается. В этом экономия метода.`, 3],
  [1, 'Опишите метод Брента ЛР1. Какие точки он хранит?', String.raw`Надёжность золотого сечения + скорость метода парабол. $x$ — лучшая найденная, $w$ — вторая по значению, $v$ — предыдущее $w$. Через них проводится парабола; её вершина берётся, если она внутри отрезка и шаг меньше половины позапрошлого, иначе — шаг золотого сечения в большую из частей $[a;x]$, $[x;b]$.`, 4],
  [1, 'Зачем условие «шаг меньше половины позапрошлого»?', 'Иначе парабола могла бы «зациклиться» — так написано в отчёте.', 4],
  [1, 'Когда метод Брента останавливается?', String.raw`Когда $x$ отстоит от обоих концов отрезка не больше чем на $\varepsilon$ (в коде: while x − a > eps or b − x > eps).`, 4],
  [1, 'Почему 1–2 итерации Брента золотые, а 8-я тоже золотая?', String.raw`Сначала среди $x,w,v$ ещё нет трёх разных точек. На 8-й вершина параболы оказалась ближе $2\cdot tol=\varepsilon$ к правому концу $b=2{,}000217$, поэтому сделан шаг золотого сечения, после чего выполнилось условие остановки.`, 4],
  [1, 'Почему у Брента при ε = 0,0005 вычислений 9, а при 0,001 — 10?', String.raw`От $\varepsilon$ зависит допуск $tol$, а значит и то, какие шаги будут параболическими. При 0,0005 парабола попала в окрестность минимума удачнее, и остановка наступила раньше.`, 4],
  [1, 'Сравните методы ЛР1 по таблице 2.', String.raw`Равномерный: 6001/6001, $x=2{,}000000$. Золотое: 19/21, $x=2{,}000028$. Брент: 8/9, $x=1{,}999967$. Брент лучший, равномерный — самый дорогой.`, 5],
  [1, 'Как растёт число вычислений при уменьшении ε (таблица 3)?', String.raw`Равномерный — как $1/\varepsilon$ (×10 на порядок); золотое — логарифмически, ≈ +5 на порядок; Брент в 1,4–2,3 раза меньше золотого.`, 5],
  [0, 'Где вы использовали GenAI и что сделали сами?', 'Claude Opus 5.5 (claude.ai; в ЛР2 ещё Claude Code): помощь с программой на Python, графиком, таблицами и оформлением. Сам: сверка алгоритмов с лекциями, вывод аналитического решения (в ЛР2 и проверка выпуклости), ручная проверка первых итераций, запуск при разных ε, выводы.', 5],
  [2, 'Как задача на максимум сведена к минимизации?', String.raw`Методы ищут минимум, поэтому вместо максимума $f$ ищется минимум $\varphi(x)=-f(x)$. Точка та же, $\max f=-\min\varphi$.`, 6],
  [2, 'Найдите максимум ЛР2 аналитически.', String.raw`$f'=5x\,e^{-x/2}(2-x/2)=0\Rightarrow x=0,\ 4$; на $[2;6]$ только 4. $f''(4)=-10e^{-2}\approx-1{,}353<0$ — максимум. $f(2)\approx7{,}3576$, $f(6)\approx8{,}9617$ меньше — $x^*=4$, $f^*=80e^{-2}\approx10{,}826823$.`, 6],
  [2, 'Почему φ выпукла на всём отрезке?', String.raw`$f''=5e^{-x/2}(x^2/4-2x+2)$ обращается в ноль при $4\pm2\sqrt2\approx1{,}172;\ 6{,}828$ — вне $[2;6]$, значит $f''<0$ на всём отрезке и $\varphi=-f$ выпукла.`, 6],
  [2, 'Что дают знаки φ′ на концах?', String.raw`$\varphi'(2)\approx-3{,}679<0$, $\varphi'(6)\approx1{,}494>0$ — корень $\varphi'$ на отрезке один, $x=4$.`, 6],
  [2, 'Выведите точку пересечения касательных.', String.raw`$\varphi(a)+\varphi'(a)(c-a)=\varphi(b)+\varphi'(b)(c-b)\Rightarrow c=\dfrac{\varphi(b)-\varphi(a)+a\varphi'(a)-b\varphi'(b)}{\varphi'(a)-\varphi'(b)}$.`, 7],
  [2, 'Почему c всегда внутри отрезка и как выбирается сторона?', String.raw`$\varphi'(a)<0<\varphi'(b)$, касательные лежат не выше выпуклого графика. Если $\varphi'(c)>0$ — минимум левее, $b:=c$; если $<0$ — $a:=c$.`, 7],
  [2, 'Откуда 22 вычисления у метода касательных?', String.raw`По два ($\varphi$ и $\varphi'$) в концах исходного отрезка и по два на каждой из 9 итераций: $4+2\cdot9$.`, 7],
  [2, 'Когда остановился метод касательных и какой ответ?', String.raw`На 9-й итерации $|\varphi'(c)|=0{,}001034\le\varepsilon$. $x=4{,}000764$, $f=10{,}8268222641$.`, 7],
  [2, 'Какая сходимость у метода касательных?', String.raw`Линейная: при уменьшении $\varepsilon$ в 10 раз +2–4 итерации; отрезок за итерацию сокращается в среднем примерно в 2 раза (14 → 40 вычислений).`, 7],
  [2, 'Почему метод Брента в ЛР2 — метод поиска корня?', String.raw`Минимум выпуклой функции — корень уравнения $\varphi'(x)=0$, а метод Брента — метод поиска корня.`, 8],
  [2, 'Какие точки хранит Брент ЛР2?', String.raw`$b$ — текущее приближение (где $|\varphi'|$ меньше), $a$ — предыдущее значение $b$, $c$ — точка, где $\varphi'$ другого знака; корень всегда между $b$ и $c$.`, 8],
  [2, 'Как Брент выбирает следующую точку?', String.raw`Обратная квадратичная интерполяция по трём точкам, секущая — если различных точек две. Если точка выходит за $[b;c]$ или шаг больше половины позапрошлого — деление пополам.`, 8],
  [2, 'Почему первый шаг — секущая и нужна ли была бисекция?', 'В начале известны только концы отрезка — две точки, значит секущая. Деление пополам ни разу не понадобилось: все точки попадали внутрь отрезка.', 8],
  [2, 'Откуда 9 вычислений у Брента ЛР2?', String.raw`Два значения $\varphi'$ в концах, по одному на каждой из 6 итераций и одно вычисление $f$ в найденной точке.`, 8],
  [2, 'Сравните методы ЛР2 по таблице 3.', String.raw`Касательных: 22 вычисления, 9 итераций, $x=4{,}000764$, $|x-x^*|=7{,}64\cdot10^{-4}$. Брента: 9 вычислений, 6 итераций, $x=4{,}000306$, $|x-x^*|=3{,}06\cdot10^{-4}$. Брент лучше.`, 9],
  [2, 'Как методы реагируют на уменьшение ε (таблица 4)?', String.raw`Касательные: 14, 20, 22, 28, 32, 40 — +4–8 вычислений на порядок. Брент: 8 → 10 — почти не реагирует; при $\varepsilon=0{,}00001$ 10 против 40.`, 9],
];
const CHECK = ['1. Цель работы', '2. Постановка задачи (вариант 21, методы)', '3. Использование GenAI', '4. График функции', '5. Аналитическое решение', '6. Описание методов', '7. Листинг программы', '8. Результаты вычислений (таблицы итераций)', '9. Сравнение методов (таблицы 2–3 в ЛР1, 3–4 в ЛР2)', '10. Выводы'];
let flt = 'all';
const FL = [['all', 'Все'], ['1', 'ЛР1'], ['2', 'ЛР2'], ['todo', 'Ещё не знаю']];
const P0 = () => loadProgress();
function draw() {
  const p = P0(), known = p.def || {};
  $('st').innerHTML = `<div><b>${Object.keys(known).length} / ${Q.length}</b><span>вопросов отмечено «знаю»</span></div>`;
  $('flt').innerHTML = '';
  FL.forEach(([k, n]) => { const b = el('button', 'btn sm ' + (k === flt ? 'go' : 'quiet'), n); b.onclick = () => { flt = k; draw(); }; $('flt').append(b); });
  $('list').innerHTML = '';
  Q.forEach(([lab, q, a, ch], i) => {
    if (flt === 'todo' ? known[i] : flt !== 'all' && String(lab) !== flt) return;
    const c = el('div', 'pcard flash' + (known[i] ? ' ok' : ''));
    c.innerHTML = `<div class="ph"><span>${lab ? 'ЛР' + lab : 'общий'}</span><a class="tg" href="../ch0${ch}/" onclick="event.stopPropagation()">глава ${ch}</a><label class="st" onclick="event.stopPropagation()"><input type="checkbox" ${known[i] ? 'checked' : ''}> знаю</label></div><div class="qq">${richHTML(q)}</div><div class="ans">${richHTML(a)}</div>`;
    c.querySelector('input').onchange = e => { progress(pp => { pp.def = pp.def || {}; if (e.target.checked) pp.def[i] = 1; else delete pp.def[i]; }); draw(); };
    c.onclick = () => c.classList.toggle('open');
    $('list').append(c);
  });
  $('chk').innerHTML = '';
  CHECK.forEach((s, i) => {
    const r = el('label', 'chk'); r.innerHTML = `<input type="checkbox" ${(p.chk || {})[i] ? 'checked' : ''}><span>${s}</span>`;
    r.querySelector('input').onchange = e => progress(pp => { pp.chk = pp.chk || {}; if (e.target.checked) pp.chk[i] = 1; else delete pp.chk[i]; });
    $('chk').append(r);
  });
}
draw();
</script>
</body>
</html>
